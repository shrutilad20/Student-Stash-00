spring.application.name=studentstash

# ===================
# MySQL DataSource
# ===================
spring.datasource.url=jdbc:mysql://localhost:3306/studentstash_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

